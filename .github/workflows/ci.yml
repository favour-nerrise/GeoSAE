name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify all stage modules import
        run: |
          python -c "
          import importlib
          for m in [
              'geosae',
              'geosae.stage1_prior',
              'geosae.stage2_train',
              'geosae.stage3_annotate',
              'geosae.stage4_evaluate',
              'geosae.stage5_localize',
              'geosae.stage6_cross_cohort',
          ]:
              importlib.import_module(m)
          "

      - name: Run pytest
        run: pytest tests/ -q
