[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geosae"
version = "0.1.0"
description = "Compact reference implementation of GeoSAE."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
localization = [
  "nibabel>=5.0",
  "nilearn>=0.10",
]

[tool.setuptools.packages.find]
include = ["geosae*"]
